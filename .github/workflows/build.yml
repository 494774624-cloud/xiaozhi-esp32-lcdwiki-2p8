name: Build 2.8 board

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build lcdwiki-esp32-s3-2.8
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py lcdwiki-esp32-s3-2.8

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-2p8-firmware
          path: |
            build/merged-binary.bin
            releases/*.zip
          if-no-files-found: error
